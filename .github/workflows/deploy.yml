name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # PROJECT site: github.com/tojonoy/portfolio -> tojonoy.github.io/portfolio/
      # BASE must match the repo name or every asset 404s. It also feeds
      # BrowserRouter's basename in src/main.jsx, so routes depend on it too.
      # If this ever becomes a user site (repo named tojonoy.github.io), drop
      # the env block so base falls back to '/'.
      - run: npm run build
        env:
          BASE: /portfolio/
      # enablement: true lets the workflow turn Pages on itself, instead of
      # failing with "Get Pages site failed ... Not Found".
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
